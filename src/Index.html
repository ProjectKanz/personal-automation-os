<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --page: #101124;
        --ink: #f7f8ff;
        --muted: #aeb6d9;
        --soft: #d8ddff;
        --line: rgba(255, 255, 255, 0.11);
        --line-strong: rgba(255, 255, 255, 0.18);
        --panel: rgba(39, 38, 78, 0.9);
        --panel-2: rgba(54, 49, 101, 0.9);
        --panel-3: rgba(26, 27, 58, 0.92);
        --nav: rgba(62, 53, 111, 0.88);
        --cyan: #20d8e8;
        --pink: #f052c8;
        --violet: #9065ff;
        --green: #63eda8;
        --amber: #ffd166;
        --red: #ff6b7a;
        --shadow: 0 26px 86px rgba(10, 9, 32, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 9% 7%, rgba(32, 216, 232, 0.2), transparent 28rem),
          radial-gradient(circle at 87% 16%, rgba(240, 82, 200, 0.26), transparent 30rem),
          linear-gradient(135deg, #8b65df 0%, #b97be6 34%, #14142e 34%, #101124 100%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
      }

      .loading-card {
        width: min(420px, calc(100vw - 32px));
        padding: 26px;
        border-radius: 10px;
        background: rgba(22, 23, 51, 0.9);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .loader-line {
        height: 8px;
        margin-top: 18px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }

      .loader-line span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
        animation: loadingSlide 1.3s ease-in-out infinite;
      }

      @keyframes loadingSlide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }

      .shell {
        width: min(1500px, calc(100vw - 28px));
        min-height: calc(100vh - 48px);
        margin: 24px auto;
        display: grid;
        grid-template-columns: 72px 230px minmax(0, 1fr) 320px;
        overflow: hidden;
        border-radius: 14px;
        background: rgba(15, 16, 38, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.13);
        box-shadow: var(--shadow);
      }

      .rail {
        padding: 18px 10px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        background: #15142f;
        border-right: 1px solid var(--line);
      }

      .brand-dot,
      .rail-button,
      .avatar {
        display: grid;
        place-items: center;
      }

      .brand-dot {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        font-weight: 900;
        background: conic-gradient(from 230deg, var(--pink), var(--violet), var(--cyan), var(--pink));
        box-shadow: 0 0 34px rgba(240, 82, 200, 0.48);
      }

      .rail-button {
        width: 44px;
        height: 44px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.06);
        transition: transform 160ms ease, border-color 160ms ease, color 160ms ease;
      }

      .rail-button:hover,
      .rail-button.active {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.22);
        transform: translateY(-1px);
      }

      .rail-button.active {
        background: linear-gradient(145deg, var(--cyan), var(--violet) 55%, var(--pink));
      }

      .side {
        padding: 22px 14px;
        background: var(--nav);
        border-right: 1px solid var(--line);
      }

      .section-label {
        margin: 0 0 14px;
        color: #e6e9ff;
        font-size: 13px;
        font-weight: 800;
      }

      .nav {
        display: grid;
        gap: 7px;
      }

      .nav-item {
        width: 100%;
        min-height: 44px;
        display: grid;
        grid-template-columns: 28px 1fr;
        align-items: center;
        padding: 0 12px;
        color: #e0e3ff;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 7px;
        text-align: left;
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }

      .nav-item:hover,
      .nav-item.active {
        background: rgba(255, 255, 255, 0.11);
        border-color: rgba(255, 255, 255, 0.08);
      }

      .nav-item.active {
        color: #fff;
        box-shadow: inset 3px 0 0 var(--cyan);
      }

      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 20px 22px 26px;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 12px;
        align-items: center;
      }

      .status-pill,
      .action-button,
      .tag {
        border-radius: 999px;
      }

      .status-pill {
        min-height: 42px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        color: #cfd6ff;
        background: rgba(13, 15, 40, 0.62);
        border: 1px solid var(--line);
        overflow: hidden;
      }

      .pulse {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 18px rgba(99, 237, 168, 0.7);
      }

      .pulse.syncing {
        background: var(--amber);
        box-shadow: 0 0 18px rgba(255, 209, 102, 0.68);
      }

      .pulse.paused {
        background: var(--muted);
        box-shadow: none;
      }

      .status-text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }

      .action-button,
      .item-action,
      .open-link {
        min-height: 42px;
        padding: 0 15px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--line-strong);
        text-decoration: none;
        font-size: 13px;
        white-space: nowrap;
      }

      .action-button:hover,
      .item-action:hover,
      .open-link:hover {
        background: rgba(255, 255, 255, 0.13);
      }

      .hero {
        min-height: 166px;
        position: relative;
        display: grid;
        align-items: end;
        overflow: hidden;
        padding: 26px 30px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        background:
          linear-gradient(110deg, rgba(34, 34, 78, 0.94), rgba(33, 42, 89, 0.76)),
          radial-gradient(circle at 78% 30%, rgba(32, 216, 232, 0.76), transparent 18rem),
          radial-gradient(circle at 35% 20%, rgba(240, 82, 200, 0.48), transparent 15rem),
          linear-gradient(135deg, #23234d, #151732);
      }

      .hero:before,
      .hero:after {
        content: "";
        position: absolute;
        opacity: 0.9;
        transform: rotate(-18deg);
      }

      .hero:before {
        width: 150px;
        height: 104px;
        top: 34px;
        right: 150px;
        border-radius: 26px;
        background: linear-gradient(135deg, rgba(32, 216, 232, 0.85), rgba(255, 255, 255, 0.1));
      }

      .hero:after {
        width: 108px;
        height: 108px;
        top: 36px;
        right: 62px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--pink), var(--violet));
      }

      .hero-content {
        position: relative;
        z-index: 1;
        max-width: 600px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #dce3ff;
        font-size: 12px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 46px);
        line-height: 1.03;
        letter-spacing: 0;
      }

      .sub {
        margin: 10px 0 0;
        max-width: 520px;
        color: #d9defd;
        font-size: 14px;
        line-height: 1.45;
      }

      .view-title {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 14px;
      }

      .view-title h2 {
        margin: 0;
        font-size: 20px;
      }

      .view-title p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .grid.two {
        grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
      }

      .panel {
        min-width: 0;
        border-radius: 9px;
        padding: 16px;
        background:
          linear-gradient(180deg, rgba(60, 55, 111, 0.9), rgba(34, 34, 72, 0.94));
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 46px rgba(7, 8, 26, 0.24);
      }

      .panel-title {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
      }

      h3 {
        margin: 0;
        font-size: 15px;
        line-height: 1.2;
      }

      .mini {
        color: var(--muted);
        font-size: 12px;
      }

      .metric {
        font-size: 38px;
        font-weight: 900;
        line-height: 1;
      }

      .metric.compact {
        font-size: 30px;
      }

      .metric-row {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 10px;
      }

      .progress {
        height: 9px;
        margin-top: 14px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.11);
      }

      .progress span {
        display: block;
        height: 100%;
        min-width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .list.scroll {
        max-height: 440px;
        overflow: auto;
        padding-right: 4px;
      }

      .list-item {
        min-height: 54px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 11px 13px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .list-item.habit-editor {
        grid-template-columns: minmax(0, 1fr);
        align-items: stretch;
      }

      .list-item:hover {
        border-color: rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.085);
      }

      .item-main {
        min-width: 0;
      }

      .item-title {
        font-size: 14px;
        font-weight: 800;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .item-sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .item-controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        margin-top: 10px;
      }

      .note-input {
        width: 100%;
        min-height: 38px;
        color: var(--ink);
        background: rgba(13, 15, 40, 0.62);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 0 10px;
        outline: none;
      }

      .note-input:focus {
        border-color: rgba(32, 216, 232, 0.48);
        box-shadow: 0 0 0 3px rgba(32, 216, 232, 0.09);
      }

      .item-action {
        min-height: 38px;
        border-radius: 7px;
        padding: 0 11px;
      }

      .item-action[disabled],
      .action-button[disabled] {
        cursor: wait;
        opacity: 0.62;
      }

      .tag {
        padding: 5px 9px;
        color: #fff;
        border: 1px solid rgba(32, 216, 232, 0.3);
        background: rgba(32, 216, 232, 0.16);
        font-size: 11px;
        white-space: nowrap;
      }

      .tag.pink {
        border-color: rgba(240, 82, 200, 0.34);
        background: rgba(240, 82, 200, 0.18);
      }

      .tag.green {
        border-color: rgba(99, 237, 168, 0.32);
        background: rgba(99, 237, 168, 0.16);
      }

      .tag.amber {
        border-color: rgba(255, 209, 102, 0.3);
        background: rgba(255, 209, 102, 0.14);
      }

      .wide {
        grid-column: span 2;
      }

      .right {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 22px 18px;
        background: var(--panel-3);
        border-left: 1px solid var(--line);
      }

      .profile {
        padding: 10px 0 8px;
        text-align: center;
      }

      .avatar {
        width: 94px;
        height: 94px;
        margin: 0 auto 12px;
        border-radius: 50%;
        color: #fff;
        font-size: 30px;
        font-weight: 950;
        background:
          linear-gradient(#151733, #151733) padding-box,
          conic-gradient(var(--cyan), var(--violet), var(--pink), var(--cyan)) border-box;
        border: 3px solid transparent;
        box-shadow: 0 0 44px rgba(32, 216, 232, 0.24);
      }

      .profile-name {
        font-size: 15px;
        font-weight: 900;
      }

      .profile-sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .sector-bar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        font-size: 12px;
      }

      .sector-track {
        height: 8px;
        margin-top: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.11);
      }

      .sector-track span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--amber), var(--pink));
      }

      .audit-text {
        max-height: 320px;
        overflow: auto;
        color: #dfe3ff;
        font-size: 13px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .empty {
        padding: 14px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 8px;
        font-size: 13px;
      }

      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 20;
        max-width: min(380px, calc(100vw - 28px));
        padding: 13px 15px;
        color: #fff;
        background: rgba(22, 23, 51, 0.96);
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        box-shadow: 0 18px 54px rgba(4, 5, 18, 0.36);
        font-size: 13px;
      }

      .toast.success {
        border-color: rgba(99, 237, 168, 0.35);
      }

      .toast.error {
        border-color: rgba(255, 107, 122, 0.42);
      }

      .mobile-tabs {
        display: none;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.22);
        border-radius: 999px;
      }

      @media (max-width: 1160px) {
        .shell {
          grid-template-columns: 68px 210px minmax(0, 1fr);
        }

        .right {
          display: none;
        }
      }

      @media (max-width: 860px) {
        body {
          background: #101124;
        }

        .shell {
          width: 100vw;
          min-height: 100vh;
          margin: 0;
          border: 0;
          border-radius: 0;
          grid-template-columns: 1fr;
        }

        .rail,
        .side {
          display: none;
        }

        .main {
          padding: 14px;
        }

        .topbar {
          grid-template-columns: 1fr auto;
        }

        .open-link {
          display: none;
        }

        .mobile-tabs {
          display: flex;
          gap: 8px;
          overflow-x: auto;
          padding-bottom: 2px;
        }

        .mobile-tab {
          flex: 0 0 auto;
          min-height: 36px;
          padding: 0 12px;
          border-radius: 999px;
          border: 1px solid var(--line);
          background: rgba(255, 255, 255, 0.07);
          color: var(--soft);
        }

        .mobile-tab.active {
          color: #fff;
          background: linear-gradient(135deg, rgba(32, 216, 232, 0.34), rgba(240, 82, 200, 0.22));
        }

        .hero {
          min-height: 146px;
          padding: 20px;
        }

        .hero:before,
        .hero:after {
          opacity: 0.45;
        }

        .grid,
        .grid.two {
          grid-template-columns: 1fr;
        }

        .wide {
          grid-column: auto;
        }
      }

      @media (max-width: 520px) {
        .topbar {
          grid-template-columns: 1fr;
        }

        .action-button {
          width: 100%;
        }

        .hero:before,
        .hero:after {
          display: none;
        }

        .item-title,
        .item-sub {
          white-space: normal;
        }

        .item-controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="loading">
      <div class="loading-card">
        Loading command center
        <div class="loader-line"><span></span></div>
      </div>
    </div>

    <script>
      const app = document.getElementById("app");
      const views = [
        { id: "home", label: "Home", icon: "⌂" },
        { id: "habit", label: "Habit", icon: "✓" },
        { id: "career", label: "Career", icon: "↗" },
        { id: "trading", label: "Trading", icon: "◇" },
        { id: "audit", label: "AI Audit", icon: "✦" }
      ];
      let dashboardData = null;
      let activeView = "home";
      let loadTimer = null;
      let busyAction = false;
      let toastTimer = null;
      let autoRefreshTimer = null;
      let isSyncing = false;
      let lastSyncedAt = null;
      const AUTO_REFRESH_INTERVAL_MS = 45000;

      loadDashboard();
      document.addEventListener("visibilitychange", handleVisibilityChange);

      function loadDashboard(options) {
        const settings = options || {};
        const isSilent = settings.silent === true && dashboardData !== null;

        if (isSyncing || busyAction) return;

        isSyncing = true;

        if (isSilent) {
          updateSyncIndicator();
        } else {
          renderLoading("Loading command center");
        }

        window.clearTimeout(loadTimer);
        loadTimer = window.setTimeout(() => {
          isSyncing = false;
          renderError({
            message: "Dashboard data request timed out. Refresh once; if it keeps happening, check Apps Script executions."
          });
        }, 25000);

        google.script.run
          .withSuccessHandler(data => {
            window.clearTimeout(loadTimer);
            isSyncing = false;
            dashboardData = data || {};
            lastSyncedAt = new Date();
            renderShell();
            scheduleAutoRefresh();
          })
          .withFailureHandler(error => {
            isSyncing = false;
            if (isSilent) {
              showToast(error && error.message ? error.message : error, "error");
              updateSyncIndicator();
              scheduleAutoRefresh();
              return;
            }

            renderError(error);
          })
          .getWebDashboardData();
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderLoading(message) {
        app.className = "loading";
        app.innerHTML = `
          <div class="loading-card">
            ${escapeHtml(message)}
            <div class="loader-line"><span></span></div>
          </div>
        `;
      }

      function renderShell() {
        const data = dashboardData || {};
        const habit = data.habit || {};
        const career = data.career || {};
        const audit = data.audit || {};

        app.className = "shell";
        app.innerHTML = `
          <aside class="rail">
            <div class="brand-dot">K</div>
            ${views.map(view => `
              <button class="rail-button ${view.id === activeView ? "active" : ""}" data-view="${view.id}" title="${escapeHtml(view.label)}">
                ${escapeHtml(view.icon)}
              </button>
            `).join("")}
          </aside>

          <aside class="side">
            <p class="section-label">Explore</p>
            <nav class="nav">
              ${views.map(view => `
                <button class="nav-item ${view.id === activeView ? "active" : ""}" data-view="${view.id}">
                  <span>${escapeHtml(view.icon)}</span>
                  <span>${escapeHtml(view.label)}</span>
                </button>
              `).join("")}
            </nav>
          </aside>

          <main class="main">
            <div class="topbar">
              <div class="status-pill">
                <span class="pulse ${getSyncPulseClass()}"></span>
                <span class="status-text">${escapeHtml(getSyncStatusText(data.generatedAt))}</span>
              </div>
              <button class="action-button" data-refresh="true">Refresh</button>
              <a class="open-link" href="${escapeHtml(data.spreadsheetUrl || "#")}" target="_blank">Open Sheet</a>
            </div>

            <div class="mobile-tabs">
              ${views.map(view => `
                <button class="mobile-tab ${view.id === activeView ? "active" : ""}" data-view="${view.id}">
                  ${escapeHtml(view.label)}
                </button>
              `).join("")}
            </div>

            ${renderView()}
          </main>

          <aside class="right">
            <div class="profile">
              <div class="avatar">OS</div>
              <div class="profile-name">Kemas Operator</div>
              <div class="profile-sub">V3.4 · Agentic AI</div>
            </div>

            <article class="panel">
              <div class="panel-title">
                <h3>Today</h3>
                <span class="tag green">${habit.percentage || 0}%</span>
              </div>
              <div class="metric compact">${habit.done || 0}/${habit.total || 0}</div>
              <div class="mini">habits complete · ${habit.notesCount || 0} notes</div>
              <div class="progress"><span style="width:${clampPercent(habit.percentage)}%"></span></div>
            </article>

            <article class="panel">
              <div class="panel-title">
                <h3>Career Mix</h3>
                <span class="mini">${career.successRate || 0}% offer</span>
              </div>
              <div class="list">
                ${renderSectors(career.sectors)}
              </div>
            </article>

            <article class="panel">
              <div class="panel-title">
                <h3>Latest Audit</h3>
                <span class="tag pink">Row ${audit.row || "-"}</span>
              </div>
              <div class="audit-text">${escapeHtml(audit.preview || "No audit available yet.")}</div>
            </article>
          </aside>
        `;

        bindShellEvents();
      }

      function renderView() {
        if (activeView === "habit") return renderHabitView();
        if (activeView === "career") return renderCareerView();
        if (activeView === "trading") return renderTradingView();
        if (activeView === "audit") return renderAuditView();
        return renderHomeView();
      }

      function renderHomeView() {
        const data = dashboardData || {};
        const habit = data.habit || {};
        const career = data.career || {};
        const trading = data.trading || {};

        return `
          ${renderHero("Kanzan Command Center", "Daily execution, career pipeline, trading log, and AI audit in one operating view.", "Live operating layer")}
          <section class="grid">
            ${metricPanel("Today's Habits", `${habit.done || 0}/${habit.total || 0}`, `${habit.percentage || 0}% complete`, habit.percentage || 0, "green")}
            ${metricPanel("Weekly Rhythm", `${habit.weeklyDone || 0}/${habit.weeklyTotal || 0}`, `${habit.weeklyPercentage || 0}% last 7 days`, habit.weeklyPercentage || 0, "cyan")}
            ${metricPanel("Career Pipeline", career.totalApplications || 0, `${career.followUpsDue || 0} follow-ups due`, Math.min(100, career.totalApplications || 0), "pink")}

            <article class="panel wide">
              <div class="panel-title">
                <h3>Open Habits</h3>
                <span class="mini">${habit.notesCount || 0} notes today</span>
              </div>
              <div class="list">
                ${renderHabitList(habit.missing, 6, "Open")}
              </div>
            </article>

            <article class="panel">
              <div class="panel-title">
                <h3>Trading</h3>
                <span class="tag green">${trading.winRate || 0}% WR</span>
              </div>
              <div class="metric-row">
                <div>
                  <div class="metric">${trading.closedTrades || 0}</div>
                  <div class="mini">${trading.wins || 0} wins · ${trading.losses || 0} losses</div>
                </div>
              </div>
              <div class="progress"><span style="width:${clampPercent(trading.winRate)}%"></span></div>
            </article>

            <article class="panel wide">
              <div class="panel-title">
                <h3>Recent Applications</h3>
                <span class="mini">${career.interviewPipeline || 0} interviews</span>
              </div>
              <div class="list">
                ${renderApplications(career.recent)}
              </div>
            </article>

            <article class="panel">
              <div class="panel-title">
                <h3>Recent Trades</h3>
                <span class="mini">7 days</span>
              </div>
              <div class="list">
                ${renderTrades(trading.recent)}
              </div>
            </article>
          </section>
        `;
      }

      function renderHabitView() {
        const habit = (dashboardData || {}).habit || {};

        return `
          ${renderViewTitle("Habit Console", "Daily checklist health and seven-day consistency.")}
          <section class="grid">
            ${metricPanel("Today", `${habit.done || 0}/${habit.total || 0}`, `${habit.percentage || 0}% complete`, habit.percentage || 0, "green")}
            ${metricPanel("Open", (habit.missing || []).length, "items still active", (habit.total ? ((habit.missing || []).length / habit.total) * 100 : 0), "pink")}
            ${metricPanel("Notes", habit.notesCount || 0, "context captured today", Math.min(100, (habit.notesCount || 0) * 20), "amber")}
          </section>
          <section class="grid two">
            <article class="panel">
              <div class="panel-title">
                <h3>Open Habits</h3>
                <span class="tag pink">${(habit.missing || []).length} open</span>
              </div>
              <div class="list scroll">${renderHabitEditorList(habit.missing, false)}</div>
            </article>
            <article class="panel">
              <div class="panel-title">
                <h3>Completed</h3>
                <span class="tag green">${(habit.completed || []).length} done</span>
              </div>
              <div class="list scroll">${renderHabitEditorList(habit.completed, true)}</div>
            </article>
          </section>
        `;
      }

      function renderCareerView() {
        const career = (dashboardData || {}).career || {};

        return `
          ${renderViewTitle("Career Pipeline", "Application volume, interview signal, follow-up pressure, and sector mix.")}
          <section class="grid">
            ${metricPanel("Applications", career.totalApplications || 0, "tracked rows", Math.min(100, career.totalApplications || 0), "cyan")}
            ${metricPanel("Interviews", career.interviewPipeline || 0, "pipeline signal", Math.min(100, (career.interviewPipeline || 0) * 25), "green")}
            ${metricPanel("Follow-ups", career.followUpsDue || 0, "due now", Math.min(100, (career.followUpsDue || 0) * 25), "pink")}
          </section>
          <section class="grid two">
            <article class="panel">
              <div class="panel-title">
                <h3>Recent Applications</h3>
                <span class="tag">${career.rejectionRate || 0}% rejected</span>
              </div>
              <div class="list scroll">${renderApplications(career.recent)}</div>
            </article>
            <article class="panel">
              <div class="panel-title">
                <h3>Sector Mix</h3>
                <span class="tag amber">${(career.sectors || []).length} groups</span>
              </div>
              <div class="list">${renderSectors(career.sectors)}</div>
            </article>
          </section>
        `;
      }

      function renderTradingView() {
        const trading = (dashboardData || {}).trading || {};

        return `
          ${renderViewTitle("Trading Journal", "Closed trade activity from the last seven days.")}
          <section class="grid">
            ${metricPanel("Closed Trades", trading.closedTrades || 0, "last 7 days", Math.min(100, (trading.closedTrades || 0) * 20), "cyan")}
            ${metricPanel("Wins", trading.wins || 0, `${trading.winRate || 0}% win rate`, trading.winRate || 0, "green")}
            ${metricPanel("Losses", trading.losses || 0, "review queue", Math.min(100, (trading.losses || 0) * 25), "pink")}
          </section>
          <section class="grid">
            <article class="panel wide">
              <div class="panel-title">
                <h3>Recent Trades</h3>
                <span class="tag green">${trading.winRate || 0}% WR</span>
              </div>
              <div class="list scroll">${renderTrades(trading.recent)}</div>
            </article>
          </section>
        `;
      }

      function renderAuditView() {
        const audit = (dashboardData || {}).audit || {};

        return `
          ${renderViewTitle("AI Audit", "Latest saved weekly audit preview.")}
          <section class="grid">
            <article class="panel wide">
              <div class="panel-title">
                <h3>Latest Audit</h3>
                <span class="tag pink">Row ${audit.row || "-"}</span>
              </div>
              <div class="audit-text">${escapeHtml(audit.preview || "No audit available yet.")}</div>
            </article>
          </section>
        `;
      }

      function renderHero(title, subtitle, eyebrow) {
        return `
          <section class="hero">
            <div class="hero-content">
              <p class="eyebrow">${escapeHtml(eyebrow)}</p>
              <h1>${escapeHtml(title)}</h1>
              <p class="sub">${escapeHtml(subtitle)}</p>
            </div>
          </section>
        `;
      }

      function renderViewTitle(title, subtitle) {
        return `
          <section class="view-title">
            <div>
              <h2>${escapeHtml(title)}</h2>
              <p>${escapeHtml(subtitle)}</p>
            </div>
          </section>
        `;
      }

      function metricPanel(title, value, caption, percent, tone) {
        const tagClass = tone === "green" ? "green" : tone === "pink" ? "pink" : tone === "amber" ? "amber" : "";

        return `
          <article class="panel">
            <div class="panel-title">
              <h3>${escapeHtml(title)}</h3>
              <span class="tag ${tagClass}">Live</span>
            </div>
            <div class="metric-row">
              <div>
                <div class="metric">${escapeHtml(value)}</div>
                <div class="mini">${escapeHtml(caption)}</div>
              </div>
            </div>
            <div class="progress"><span style="width:${clampPercent(percent)}%"></span></div>
          </article>
        `;
      }

      function renderHabitList(items, limit, label, tone) {
        if (!items || items.length === 0) {
          return `<div class="empty">No habit records in this state.</div>`;
        }

        return items.slice(0, limit || 6).map(item => `
          <div class="list-item">
            <div class="item-main">
              <div class="item-title">${escapeHtml(item.activity)}</div>
              <div class="item-sub">${escapeHtml(item.category)}${item.note ? " · " + escapeHtml(item.note) : ""}</div>
            </div>
            <span class="tag ${tone === "green" ? "green" : "pink"}">${escapeHtml(label || "Open")}</span>
          </div>
        `).join("");
      }

      function renderHabitEditorList(items, isDone) {
        if (!items || items.length === 0) {
          return `<div class="empty">No habit records in this state.</div>`;
        }

        return items.map(item => {
          const encodedActivity = encodeURIComponent(item.activity || "");
          const nextDone = isDone ? "false" : "true";
          const actionLabel = isDone ? "Reopen" : "Done";

          return `
            <div class="list-item habit-editor">
              <div class="item-main">
                <div class="item-title">${escapeHtml(item.activity)}</div>
                <div class="item-sub">${escapeHtml(item.category)}${item.note ? " · " + escapeHtml(item.note) : ""}</div>
                <div class="item-controls">
                  <input class="note-input" value="${escapeHtml(item.note || "")}" placeholder="Add note or reason" data-note-input="${encodedActivity}">
                  <button class="item-action" data-note-save="${encodedActivity}">Save note</button>
                  <button class="item-action" data-status-action="${encodedActivity}" data-next-done="${nextDone}">${actionLabel}</button>
                </div>
              </div>
            </div>
          `;
        }).join("");
      }

      function renderApplications(items) {
        if (!items || items.length === 0) {
          return `<div class="empty">No application rows found yet.</div>`;
        }

        return items.map(item => `
          <div class="list-item">
            <div class="item-main">
              <div class="item-title">${escapeHtml(item.companyName)}</div>
              <div class="item-sub">${escapeHtml(item.jobTitle)} · ${escapeHtml(item.category || "Unmapped")} · ${escapeHtml(item.cvVersion || "General")}</div>
            </div>
            <span class="tag ${getStatusTone(item.status)}">${escapeHtml(item.status)}</span>
          </div>
        `).join("");
      }

      function renderTrades(items) {
        if (!items || items.length === 0) {
          return `<div class="empty">No closed trades this week.</div>`;
        }

        return items.map(item => `
          <div class="list-item">
            <div class="item-main">
              <div class="item-title">${escapeHtml(item.symbol)} ${escapeHtml(item.side)}</div>
              <div class="item-sub">${escapeHtml(item.exitDate)} · ${escapeHtml(item.remarks || "No remarks")}</div>
            </div>
            <span class="tag ${item.outcome === "Win" ? "green" : item.outcome === "Loss" ? "pink" : "amber"}">${escapeHtml(item.outcome)}</span>
          </div>
        `).join("");
      }

      function renderSectors(items) {
        if (!items || items.length === 0) {
          return `<div class="empty">No sector signal yet.</div>`;
        }

        const max = Math.max(...items.map(item => item.count), 1);

        return items.map(item => `
          <div>
            <div class="sector-bar">
              <span>${escapeHtml(item.label)}</span>
              <strong>${escapeHtml(item.count)}</strong>
            </div>
            <div class="sector-track"><span style="width:${Math.max(8, (item.count / max) * 100)}%"></span></div>
          </div>
        `).join("");
      }

      function getStatusTone(status) {
        const normalized = String(status || "").toLowerCase();
        if (normalized.indexOf("interview") !== -1 || normalized.indexOf("offer") !== -1) return "green";
        if (normalized.indexOf("rejected") !== -1 || normalized.indexOf("withdraw") !== -1) return "pink";
        if (normalized.indexOf("assessment") !== -1) return "amber";
        return "";
      }

      function clampPercent(value) {
        return Math.max(0, Math.min(100, Number(value) || 0));
      }

      function bindShellEvents() {
        app.querySelectorAll("[data-view]").forEach(button => {
          button.addEventListener("click", () => {
            activeView = button.getAttribute("data-view");
            renderShell();
          });
        });

        const refresh = app.querySelector("[data-refresh]");
        if (refresh) {
          refresh.addEventListener("click", () => loadDashboard({ silent: true }));
        }

        app.querySelectorAll("[data-status-action]").forEach(button => {
          button.addEventListener("click", () => {
            const activity = decodeURIComponent(button.getAttribute("data-status-action") || "");
            const nextDone = button.getAttribute("data-next-done") === "true";
            updateHabitStatus(activity, nextDone);
          });
        });

        app.querySelectorAll("[data-note-save]").forEach(button => {
          button.addEventListener("click", () => {
            const activity = decodeURIComponent(button.getAttribute("data-note-save") || "");
            const input = app.querySelector(`[data-note-input="${button.getAttribute("data-note-save")}"]`);
            updateHabitNote(activity, input ? input.value : "");
          });
        });
      }

      function setActionBusy(isBusy) {
        busyAction = isBusy;
        app.querySelectorAll("[data-status-action], [data-note-save], [data-refresh]").forEach(button => {
          button.disabled = isBusy;
        });

        if (!isBusy) {
          scheduleAutoRefresh();
        }
      }

      function updateHabitStatus(activity, nextDone) {
        if (busyAction) return;
        setActionBusy(true);

        google.script.run
          .withSuccessHandler(data => {
            dashboardData = data || {};
            lastSyncedAt = new Date();
            setActionBusy(false);
            showToast(nextDone ? "Habit marked done." : "Habit reopened.", "success");
            renderShell();
          })
          .withFailureHandler(error => {
            setActionBusy(false);
            showToast(error && error.message ? error.message : error, "error");
          })
          .updateWebHabitStatus(activity, nextDone);
      }

      function updateHabitNote(activity, note) {
        if (busyAction) return;
        setActionBusy(true);

        google.script.run
          .withSuccessHandler(data => {
            dashboardData = data || {};
            lastSyncedAt = new Date();
            setActionBusy(false);
            showToast("Habit note saved.", "success");
            renderShell();
          })
          .withFailureHandler(error => {
            setActionBusy(false);
            showToast(error && error.message ? error.message : error, "error");
          })
          .updateWebHabitNote(activity, note);
      }

      function showToast(message, type) {
        window.clearTimeout(toastTimer);
        const existing = document.querySelector(".toast");
        if (existing) existing.remove();

        const toast = document.createElement("div");
        toast.className = `toast ${type || ""}`;
        toast.textContent = message;
        document.body.appendChild(toast);

        toastTimer = window.setTimeout(() => {
          toast.remove();
        }, 3200);
      }

      function scheduleAutoRefresh() {
        window.clearTimeout(autoRefreshTimer);

        if (document.hidden || busyAction) return;

        autoRefreshTimer = window.setTimeout(() => {
          loadDashboard({ silent: true });
        }, AUTO_REFRESH_INTERVAL_MS);
      }

      function handleVisibilityChange() {
        if (document.hidden) {
          window.clearTimeout(autoRefreshTimer);
          updateSyncIndicator();
          return;
        }

        loadDashboard({ silent: true });
      }

      function getSyncPulseClass() {
        if (isSyncing) return "syncing";
        if (document.hidden) return "paused";
        return "";
      }

      function getSyncStatusText(generatedAt) {
        if (isSyncing) {
          return "Personal Productivity OS · Syncing...";
        }

        if (document.hidden) {
          return "Personal Productivity OS · Auto-sync paused";
        }

        if (lastSyncedAt) {
          return "Personal Productivity OS · Last synced " + formatLocalTime(lastSyncedAt);
        }

        return "Personal Productivity OS · " + (generatedAt || "Live");
      }

      function updateSyncIndicator() {
        const pulse = app.querySelector(".pulse");
        const text = app.querySelector(".status-text");

        if (pulse) {
          pulse.className = "pulse " + getSyncPulseClass();
        }

        if (text) {
          text.textContent = getSyncStatusText(dashboardData && dashboardData.generatedAt);
        }
      }

      function formatLocalTime(date) {
        return date.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function renderError(error) {
        window.clearTimeout(loadTimer);
        app.className = "loading";
        app.innerHTML = `
          <div class="loading-card">
            Dashboard failed to load: ${escapeHtml(error && error.message ? error.message : error)}
          </div>
        `;
      }
    </script>
  </body>
</html>
