<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --page: #101124;
        --ink: #f7f8ff;
        --muted: #aeb6d9;
        --soft: #d8ddff;
        --line: rgba(255, 255, 255, 0.11);
        --line-strong: rgba(255, 255, 255, 0.18);
        --panel: rgba(39, 38, 78, 0.9);
        --panel-2: rgba(54, 49, 101, 0.9);
        --panel-3: rgba(26, 27, 58, 0.92);
        --nav: rgba(62, 53, 111, 0.88);
        --cyan: #20d8e8;
        --pink: #f052c8;
        --violet: #9065ff;
        --green: #63eda8;
        --amber: #ffd166;
        --red: #ff6b7a;
        --shadow: 0 26px 86px rgba(10, 9, 32, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 9% 7%, rgba(32, 216, 232, 0.2), transparent 28rem),
          radial-gradient(circle at 87% 16%, rgba(240, 82, 200, 0.26), transparent 30rem),
          linear-gradient(135deg, #8b65df 0%, #b97be6 34%, #14142e 34%, #101124 100%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
      }

      .loading-card {
        width: min(420px, calc(100vw - 32px));
        padding: 26px;
        border-radius: 10px;
        background: rgba(22, 23, 51, 0.9);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .loader-line {
        height: 8px;
        margin-top: 18px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }

      .loader-line span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
        animation: loadingSlide 1.3s ease-in-out infinite;
      }

      @keyframes loadingSlide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }

      .shell {
        width: min(1500px, calc(100vw - 28px));
        min-height: calc(100vh - 48px);
        margin: 24px auto;
        display: grid;
        grid-template-columns: 72px 230px minmax(0, 1fr) 320px;
        overflow: hidden;
        border-radius: 14px;
        background: rgba(15, 16, 38, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.13);
        box-shadow: var(--shadow);
      }

      .rail {
        padding: 18px 10px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        background: #15142f;
        border-right: 1px solid var(--line);
      }

      .brand-dot,
      .rail-button,
      .avatar {
        display: grid;
        place-items: center;
      }

      .brand-dot {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        font-weight: 900;
        background: conic-gradient(from 230deg, var(--pink), var(--violet), var(--cyan), var(--pink));
        box-shadow: 0 0 34px rgba(240, 82, 200, 0.48);
      }

      .rail-button {
        width: 44px;
        height: 44px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.06);
        transition: transform 160ms ease, border-color 160ms ease, color 160ms ease;
      }

      .rail-button:hover,
      .rail-button.active {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.22);
        transform: translateY(-1px);
      }

      .rail-button.active {
        background: linear-gradient(145deg, var(--cyan), var(--violet) 55%, var(--pink));
      }

      .side {
        padding: 22px 14px;
        background: var(--nav);
        border-right: 1px solid var(--line);
      }

      .section-label {
        margin: 0 0 14px;
        color: #e6e9ff;
        font-size: 13px;
        font-weight: 800;
      }

      .nav {
        display: grid;
        gap: 7px;
      }

      .nav-item {
        width: 100%;
        min-height: 44px;
        display: grid;
        grid-template-columns: 28px 1fr;
        align-items: center;
        padding: 0 12px;
        color: #e0e3ff;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 7px;
        text-align: left;
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }

      .nav-item:hover,
      .nav-item.active {
        background: rgba(255, 255, 255, 0.11);
        border-color: rgba(255, 255, 255, 0.08);
      }

      .nav-item.active {
        color: #fff;
        box-shadow: inset 3px 0 0 var(--cyan);
      }

      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 20px 22px 26px;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 12px;
        align-items: center;
      }

      .status-pill,
      .action-button,
      .tag {
        border-radius: 999px;
      }

      .status-pill {
        min-height: 42px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        color: #cfd6ff;
        background: rgba(13, 15, 40, 0.62);
        border: 1px solid var(--line);
        overflow: hidden;
      }

      .pulse {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 18px rgba(99, 237, 168, 0.7);
      }

      .pulse.syncing {
        background: var(--amber);
        box-shadow: 0 0 18px rgba(255, 209, 102, 0.68);
      }

      .pulse.paused {
        background: var(--muted);
        box-shadow: none;
      }

      .status-text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }

      .action-button,
      .item-action,
      .open-link {
        min-height: 42px;
        padding: 0 15px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--line-strong);
        text-decoration: none;
        font-size: 13px;
        white-space: nowrap;
      }

      .action-button:hover,
      .item-action:hover,
      .open-link:hover {
        background: rgba(255, 255, 255, 0.13);
      }

      .hero {
        min-height: 166px;
        position: relative;
        display: grid;
        align-items: end;
        overflow: hidden;
        padding: 26px 30px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        background:
          linear-gradient(110deg, rgba(34, 34, 78, 0.94), rgba(33, 42, 89, 0.76)),
          radial-gradient(circle at 78% 30%, rgba(32, 216, 232, 0.76), transparent 18rem),
          radial-gradient(circle at 35% 20%, rgba(240, 82, 200, 0.48), transparent 15rem),
          linear-gradient(135deg, #23234d, #151732);
      }

      .hero:before,
      .hero:after {
        content: "";
        position: absolute;
        opacity: 0.9;
        transform: rotate(-18deg);
      }

      .hero:before {
        width: 150px;
        height: 104px;
        top: 34px;
        right: 150px;
        border-radius: 26px;
        background: linear-gradient(135deg, rgba(32, 216, 232, 0.85), rgba(255, 255, 255, 0.1));
      }

      .hero:after {
        width: 108px;
        height: 108px;
        top: 36px;
        right: 62px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--pink), var(--violet));
      }

      .hero-content {
        position: relative;
        z-index: 1;
        max-width: 600px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #dce3ff;
        font-size: 12px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 46px);
        line-height: 1.03;
        letter-spacing: 0;
      }

      .sub {
        margin: 10px 0 0;
        max-width: 520px;
        color: #d9defd;
        font-size: 14px;
        line-height: 1.45;
      }

      .view-title {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 14px;
      }

      .view-title h2 {
        margin: 0;
        font-size: 20px;
      }

      .view-title p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .grid.two {
        grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
      }

      .panel {
        min-width: 0;
        border-radius: 9px;
        padding: 16px;
        background:
          linear-gradient(180deg, rgba(60, 55, 111, 0.9), rgba(34, 34, 72, 0.94));
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 46px rgba(7, 8, 26, 0.24);
      }

      .panel-title {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
      }

      h3 {
        margin: 0;
        font-size: 15px;
        line-height: 1.2;
      }

      .mini {
        color: var(--muted);
        font-size: 12px;
      }

      .metric {
        font-size: 38px;
        font-weight: 900;
        line-height: 1;
      }

      .metric.compact {
        font-size: 30px;
      }

      .metric-row {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 10px;
      }

      .progress {
        height: 9px;
        margin-top: 14px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.11);
      }

      .progress span {
        display: block;
        height: 100%;
        min-width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
      }

      .trade-chart {
        position: relative;
        min-height: 260px;
        overflow: hidden;
        border-radius: 8px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px),
          rgba(13, 15, 40, 0.38);
        background-size: 100% 25%, 12.5% 100%, auto;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .trade-chart svg {
        width: 100%;
        height: 260px;
        display: block;
      }

      .chart-line {
        fill: none;
        stroke: url(#tradeLineGradient);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .chart-zero {
        stroke: rgba(255, 255, 255, 0.18);
        stroke-width: 1;
        stroke-dasharray: 6 7;
      }

      .chart-dot {
        stroke: rgba(16, 17, 36, 0.95);
        stroke-width: 3;
      }

      .chart-dot.win {
        fill: var(--green);
      }

      .chart-dot.loss {
        fill: var(--pink);
      }

      .chart-dot.flat {
        fill: var(--amber);
      }

      .chart-label {
        fill: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .list.scroll {
        max-height: 440px;
        overflow: auto;
        padding-right: 4px;
      }

      .list-item {
        min-height: 54px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 11px 13px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .list-item.habit-editor {
        grid-template-columns: minmax(0, 1fr);
        align-items: stretch;
      }

      .list-item:hover {
        border-color: rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.085);
      }

      .item-main {
        min-width: 0;
      }

      .item-title {
        font-size: 14px;
        font-weight: 800;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .item-sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .item-controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        margin-top: 10px;
      }

      .note-input {
        width: 100%;
        min-height: 38px;
        color: var(--ink);
        background: rgba(13, 15, 40, 0.62);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 0 10px;
        outline: none;
      }

      .note-input:focus {
        border-color: rgba(32, 216, 232, 0.48);
        box-shadow: 0 0 0 3px rgba(32, 216, 232, 0.09);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field.wide {
        grid-column: 1 / -1;
      }

      .field-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }

      .select-input {
        appearance: none;
      }

      .form-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }

      .search-row {
        margin-bottom: 12px;
      }

      .sub-link {
        color: var(--cyan);
        text-decoration: none;
      }

      .sub-link:hover {
        text-decoration: underline;
      }

      .item-action {
        min-height: 38px;
        border-radius: 7px;
        padding: 0 11px;
      }

      .item-action[disabled],
      .action-button[disabled] {
        cursor: wait;
        opacity: 0.62;
      }

      .tag {
        padding: 5px 9px;
        color: #fff;
        border: 1px solid rgba(32, 216, 232, 0.3);
        background: rgba(32, 216, 232, 0.16);
        font-size: 11px;
        white-space: nowrap;
      }

      .tag.pink {
        border-color: rgba(240, 82, 200, 0.34);
        background: rgba(240, 82, 200, 0.18);
      }

      .tag.green {
        border-color: rgba(99, 237, 168, 0.32);
        background: rgba(99, 237, 168, 0.16);
      }

      .tag.amber {
        border-color: rgba(255, 209, 102, 0.3);
        background: rgba(255, 209, 102, 0.14);
      }

      .wide {
        grid-column: span 2;
      }

      .right {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 22px 18px;
        background: var(--panel-3);
        border-left: 1px solid var(--line);
      }

      .profile {
        padding: 10px 0 8px;
        text-align: center;
      }

      .avatar {
        width: 94px;
        height: 94px;
        margin: 0 auto 12px;
        border-radius: 50%;
        color: #fff;
        font-size: 30px;
        font-weight: 950;
        background:
          linear-gradient(#151733, #151733) padding-box,
          conic-gradient(var(--cyan), var(--violet), var(--pink), var(--cyan)) border-box;
        border: 3px solid transparent;
        box-shadow: 0 0 44px rgba(32, 216, 232, 0.24);
      }

      .profile-name {
        font-size: 15px;
        font-weight: 900;
      }

      .profile-sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .sector-bar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        font-size: 12px;
      }

      .sector-track {
        height: 8px;
        margin-top: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.11);
      }

      .sector-track span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--amber), var(--pink));
      }

      .audit-text {
        max-height: 320px;
        overflow: auto;
        color: #dfe3ff;
        font-size: 13px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .empty {
        padding: 14px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 8px;
        font-size: 13px;
      }

      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 20;
        max-width: min(380px, calc(100vw - 28px));
        padding: 13px 15px;
        color: #fff;
        background: rgba(22, 23, 51, 0.96);
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        box-shadow: 0 18px 54px rgba(4, 5, 18, 0.36);
        font-size: 13px;
      }

      .toast.success {
        border-color: rgba(99, 237, 168, 0.35);
      }

      .toast.error {
        border-color: rgba(255, 107, 122, 0.42);
      }

      .mobile-tabs {
        display: none;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.22);
        border-radius: 999px;
      }

      @media (max-width: 1160px) {
        .shell {
          grid-template-columns: 68px 210px minmax(0, 1fr);
        }

        .right {
          display: none;
        }
      }

      @media (max-width: 860px) {
        body {
          background: #101124;
        }

        .shell {
          width: 100vw;
          min-height: 100vh;
          margin: 0;
          border: 0;
          border-radius: 0;
          grid-template-columns: 1fr;
        }

        .rail,
        .side {
          display: none;
        }

        .main {
          padding: 14px;
        }

        .topbar {
          grid-template-columns: 1fr auto;
        }

        .open-link {
          display: none;
        }

        .mobile-tabs {
          display: flex;
          gap: 8px;
          overflow-x: auto;
          padding-bottom: 2px;
        }

        .mobile-tab {
          flex: 0 0 auto;
          min-height: 36px;
          padding: 0 12px;
          border-radius: 999px;
          border: 1px solid var(--line);
          background: rgba(255, 255, 255, 0.07);
          color: var(--soft);
        }

        .mobile-tab.active {
          color: #fff;
          background: linear-gradient(135deg, rgba(32, 216, 232, 0.34), rgba(240, 82, 200, 0.22));
        }

        .hero {
          min-height: 146px;
          padding: 20px;
        }

        .hero:before,
        .hero:after {
          opacity: 0.45;
        }

        .grid,
        .grid.two {
          grid-template-columns: 1fr;
        }

        .wide {
          grid-column: auto;
        }
      }

      @media (max-width: 520px) {
        .topbar {
          grid-template-columns: 1fr;
        }

        .action-button {
          width: 100%;
        }

        .hero:before,
        .hero:after {
          display: none;
        }

        .item-title,
        .item-sub {
          white-space: normal;
        }

        .item-controls,
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="loading">
      <div class="loading-card">
        Loading command center
        <div class="loader-line"><span></span></div>
      </div>
    </div>

    <script>
      const app = document.getElementById("app");
      const views = [
        { id: "home", label: "Home", icon: "⌂" },
        { id: "habit", label: "Habit", icon: "✓" },
        { id: "career", label: "Career", icon: "↗" },
        { id: "trading", label: "Trading", icon: "◇" },
        { id: "audit", label: "AI Audit", icon: "✦" }
      ];
      const applicationStatuses = ["Saved", "Applied", "Assessment", "Interview", "Rejected", "Offer", "Withdrawn"];
      let dashboardData = null;
      let activeView = "home";
      let careerSearchQuery = "";
      let applicationDraft = getEmptyApplicationDraft();
      let tradingRange = getDefaultTradingRange();
      let loadTimer = null;
      let busyAction = false;
      let toastTimer = null;
      let autoRefreshTimer = null;
      let isSyncing = false;
      let lastSyncedAt = null;
      const AUTO_REFRESH_INTERVAL_MS = 45000;

      loadDashboard();
      document.addEventListener("visibilitychange", handleVisibilityChange);

      function loadDashboard(options) {
        const settings = options || {};
        const isSilent = settings.silent === true && dashboardData !== null;

        if (isSyncing || busyAction) return;

        isSyncing = true;

        if (isSilent) {
          updateSyncIndicator();
        } else {
          renderLoading("Loading command center");
        }

        window.clearTimeout(loadTimer);
        loadTimer = window.setTimeout(() => {
          isSyncing = false;
          renderError({
            message: "Dashboard data request timed out. Refresh once; if it keeps happening, check Apps Script executions."
          });
        }, 25000);

        google.script.run
          .withSuccessHandler(data => {
            window.clearTimeout(loadTimer);
            isSyncing = false;
            dashboardData = data || {};
            lastSyncedAt = new Date();
            renderShell();
            scheduleAutoRefresh();
          })
          .withFailureHandler(error => {
            isSyncing = false;
            if (isSilent) {
              showToast(error && error.message ? error.message : error, "error");
              updateSyncIndicator();
              scheduleAutoRefresh();
              return;
            }

            renderError(error);
          })
          .getWebDashboardData();
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderLoading(message) {
        app.className = "loading";

      function renderAuditView() {
        const data = dashboardData || {};
        const audit = data.audit || {};
        const habits = data.habits || {};
        const career = data.career || {};
        const trading = data.trading || {};

        const rowLabel = audit.row || "-";
        const rawPreview = String(audit.preview || "");
        const shortPreview = rawPreview
          ? rawPreview.slice(0, 120) + (rawPreview.length > 120 ? "..." : "")
          : "No audit preview available yet.";

        const habitDone = Number(habits.done || habits.completed || 0);
        const habitTotal = Number(habits.total || 0);
        const habitRatio = habitTotal ? habitDone / habitTotal : 0;
        const habitLabel = habitTotal ? `${habitDone}/${habitTotal}` : "-";

        const applications = Number(career.totalApplications || career.applications || career.total || 0);
        const interviews = Number(career.interviews || career.interviewCount || 0);

        const netPnl = Number(trading.netPnl || trading.totalPnl || trading.pnl || 0);
        const netPnlLabel = Number.isFinite(netPnl) ? formatMoney(netPnl) : "-";

        let priority = "Maintenance Mode";
        let priorityTone = "green";
        let diagnosis = "The system is stable enough to maintain the current weekly rhythm and review progress again next week.";

        if (Number.isFinite(netPnl) && netPnl < 0) {
          priority = "Risk Control";
          priorityTone = "pink";
          diagnosis = "Trading performance is negative in the current data, so this week should focus on reviewing execution and avoiding unnecessary risk.";
        } else if (habitTotal && habitRatio < 0.6) {
          priority = "Habit Recovery";
          priorityTone = "amber";
          diagnosis = "Habit completion is still low, so the main focus should be rebuilding daily consistency before adding more complexity.";
        } else if (applications > 0 && interviews === 0) {
          priority = "Career Follow-up";
          priorityTone = "cyan";
          diagnosis = "The application pipeline has activity, but interview signal is still low, so the next focus should be follow-up quality and CV targeting.";
        }

        const actions = [];

        if (Number.isFinite(netPnl) && netPnl < 0) {
          actions.push(["Review losing trades", "Check the losing trades before taking more trades."]);
        }

        if (applications > 0 && interviews === 0) {
          actions.push(["Fix follow-up list", "Review active applications and improve CV targeting."]);
        }

        if (habitTotal && habitRatio < 0.6) {
          actions.push(["Complete 3 core habits", "Prioritize the most important habits before adding extra tasks."]);
        }

        if (actions.length === 0) {
          actions.push(["Maintain weekly rhythm", "Keep the workflow stable and review progress again next week."]);
        }

        return `
          ${renderViewTitle("AI Audit", "Weekly decision board and next actions.")}

                <h3>Weekly Diagnosis</h3>

              </div>

                <strong>${escapeHtml(habitLabel)}</strong>
              </div>
              <div class="stat">

                <strong>${escapeHtml(applications)}</strong>
              </div>

                <strong>${escapeHtml(netPnlLabel)}</strong>
              </div>
            </article>

            <article class="panel wide">
              <div class="panel-title">

                <span class="tag amber">Action</span>
              </div>
              <div class="list">

        return items.map(item => `

      }

      function renderTradingChart(items) {
        if (!items || items.length === 0) {
          return `<div class="empty">No closed trades in this date range yet.</div>`;
        }

        const orderedTrades = items.slice().reverse();
        let cumulative = 0;
        const points = orderedTrades.map((item, index) => {
          const tradePnl = Number(item && item.pL);
          const safePnl = Number.isFinite(tradePnl) ? tradePnl : 0;
          cumulative += safePnl;

          return {
            index: index,
            value: cumulative,
            pnl: safePnl,
            symbol: item && item.symbol ? item.symbol : "Trade",
            exitDate: item && item.exitDate ? item.exitDate : ""
          };
        });

        const width = 720;
        const height = 260;
        const pad = 28;
        const minValue = Math.min(0, ...points.map(point => point.value));
        const maxValue = Math.max(0, ...points.map(point => point.value));
        const range = maxValue - minValue || 1;
        const plotWidth = width - pad * 2;
        const plotHeight = height - pad * 2;
        const xFor = index => points.length === 1 ? width / 2 : pad + (index / (points.length - 1)) * plotWidth;
        const yFor = value => height - pad - ((value - minValue) / range) * plotHeight;
        const linePoints = points.map(point => `${xFor(point.index).toFixed(1)},${yFor(point.value).toFixed(1)}`).join(" ");
        const zeroY = yFor(0).toFixed(1);
        const finalValue = points[points.length - 1].value;

        return `
          <div class="trade-chart">
            <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Cumulative profit and loss chart">
              <defs>
                <linearGradient id="tradeLineGradient" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#20d8e8"></stop>
                  <stop offset="55%" stop-color="#9065ff"></stop>
                  <stop offset="100%" stop-color="#f052c8"></stop>
                </linearGradient>
              </defs>
              <line class="chart-zero" x1="${pad}" y1="${zeroY}" x2="${width - pad}" y2="${zeroY}"></line>
              <polyline class="chart-line" points="${linePoints}"></polyline>
              ${points.map(point => {
                const tone = point.pnl > 0 ? "win" : point.pnl < 0 ? "loss" : "flat";
                const label = `${point.symbol} ${point.exitDate} | P/L ${formatMoney(point.pnl)} | Total ${formatMoney(point.value)}`;
                return `<circle class="chart-dot ${tone}" cx="${xFor(point.index).toFixed(1)}" cy="${yFor(point.value).toFixed(1)}" r="6"><title>${escapeHtml(label)}</title></circle>`;
              }).join("")}
              <text class="chart-label" x="${pad}" y="18">${escapeHtml(formatMoney(maxValue))}</text>
              <text class="chart-label" x="${pad}" y="${height - 8}">${escapeHtml(formatMoney(minValue))}</text>
              <text class="chart-label" x="${width - pad}" y="18" text-anchor="end">Now ${escapeHtml(formatMoney(finalValue))}</text>
            </svg>
          </div>
        `;
      }

      function formatMoney(value) {
        const amount = Number(value);

        if (!Number.isFinite(amount)) return "0";

        return amount.toLocaleString("en-US", {
          maximumFractionDigits: 2
        });
      }

      function renderCvLink(value) {
        const text = String(value || "General");

        if (/^https?:\/\//i.test(text)) {
          return `<a class="sub-link" href="${escapeHtml(text)}" target="_blank">CV PDF</a>`;
        }

        return escapeHtml(text);
      }

      function filterApplications(items) {
        const query = careerSearchQuery.trim().toLowerCase();

        if (!query) return items;

        return items.filter(item => [
          item.companyName,
          item.jobTitle,
          item.status,
          item.category,
          item.cvVersion,
          item.jobLink
        ].join(" ").toLowerCase().indexOf(query) !== -1);
      }

      function renderSectors(items) {
        if (!items || items.length === 0) {
          return `<div class="empty">No sector signal yet.</div>`;
        }

        const max = Math.max(...items.map(item => item.count), 1);

        return items.map(item => `
          <div>
            <div class="sector-bar">
              <span>${escapeHtml(item.label)}</span>
              <strong>${escapeHtml(item.count)}</strong>
            </div>
            <div class="sector-track"><span style="width:${Math.max(8, (item.count / max) * 100)}%"></span></div>
          </div>
        `).join("");
      }

      function getStatusTone(status) {
        const normalized = String(status || "").toLowerCase();
        if (normalized.indexOf("interview") !== -1 || normalized.indexOf("offer") !== -1) return "green";
        if (normalized.indexOf("rejected") !== -1 || normalized.indexOf("withdraw") !== -1) return "pink";
        if (normalized.indexOf("assessment") !== -1) return "amber";
        return "";
      }

      function clampPercent(value) {
        return Math.max(0, Math.min(100, Number(value) || 0));
      }

      function bindShellEvents() {
        app.querySelectorAll("[data-view]").forEach(button => {
          button.addEventListener("click", () => {
            activeView = button.getAttribute("data-view");
            renderShell();
          });
        });

        const refresh = app.querySelector("[data-refresh]");
        if (refresh) {
          refresh.addEventListener("click", () => {
            if (hasApplicationDraftInput() && !window.confirm("Refresh will clear the selected CV file. Continue?")) {
              return;
            }

            applicationDraft.cvFileName = "";
            applicationDraft.cvFile = null;
            loadDashboard({ silent: true });
          });
        }

        app.querySelectorAll("[data-status-action]").forEach(button => {
          button.addEventListener("click", () => {
            const activity = decodeURIComponent(button.getAttribute("data-status-action") || "");
            const nextDone = button.getAttribute("data-next-done") === "true";
            updateHabitStatus(activity, nextDone);
          });
        });

        app.querySelectorAll("[data-note-save]").forEach(button => {
          button.addEventListener("click", () => {
            const activity = decodeURIComponent(button.getAttribute("data-note-save") || "");
            const input = app.querySelector(`[data-note-input="${button.getAttribute("data-note-save")}"]`);
            updateHabitNote(activity, input ? input.value : "");
          });
        });

        const appAdd = app.querySelector("[data-app-add]");
        if (appAdd) {
          appAdd.addEventListener("click", addApplicationFromWeb);
        }

        bindApplicationDraftInputs();

        const appSearch = app.querySelector("[data-app-search]");
        if (appSearch) {
          appSearch.addEventListener("input", event => {
            careerSearchQuery = event.target.value;
            renderShell();
            const nextSearch = app.querySelector("[data-app-search]");
            if (nextSearch) {
              nextSearch.focus();
              nextSearch.setSelectionRange(nextSearch.value.length, nextSearch.value.length);
            }
          });
        }

        app.querySelectorAll("[data-app-status-save]").forEach(button => {
          button.addEventListener("click", () => {
            const rowIndex = button.getAttribute("data-app-status-save");
            const statusInput = app.querySelector(`[data-app-status-select="${rowIndex}"]`);
            const company = decodeURIComponent(button.getAttribute("data-app-company") || "");
            const role = decodeURIComponent(button.getAttribute("data-app-role") || "");
            updateApplicationStatus(rowIndex, company, role, statusInput ? statusInput.value : "");
          });
        });

        const tradingStart = app.querySelector("[data-trading-start]");
        const tradingEnd = app.querySelector("[data-trading-end]");
        if (tradingStart) {
          tradingStart.addEventListener("change", event => {
            tradingRange.startDate = event.target.value;
            loadTradingRange();
          });
        }
        if (tradingEnd) {
          tradingEnd.addEventListener("change", event => {
            tradingRange.endDate = event.target.value;
            loadTradingRange();
          });
        }
      }

      function setActionBusy(isBusy) {
        busyAction = isBusy;
        app.querySelectorAll("[data-status-action], [data-note-save], [data-refresh], [data-app-add], [data-app-status-save]").forEach(button => {
          button.disabled = isBusy;
        });

        if (!isBusy) {
          scheduleAutoRefresh();
        }
      }

      function getEmptyApplicationDraft() {
        return {
          company: "",
          role: "",
          status: "Saved",
          dateApplied: getTodayInputDate(),
          jobLink: "",
          notes: "",
          cvFileName: "",
          cvFile: null
        };
      }

      function getTodayInputDate() {
        return new Date().toISOString().slice(0, 10);
      }

      function bindApplicationDraftInputs() {
        const bindings = [
          ["[data-app-company-input]", "company"],
          ["[data-app-role-input]", "role"],
          ["[data-app-status]", "status"],
          ["[data-app-date-applied]", "dateApplied"],
          ["[data-app-job-link]", "jobLink"],
          ["[data-app-notes]", "notes"]
        ];

        bindings.forEach(([selector, key]) => {
          const input = app.querySelector(selector);
          if (!input) return;

          input.addEventListener("input", () => {
            applicationDraft[key] = input.value;
            scheduleAutoRefresh();
          });

          input.addEventListener("change", () => {
            applicationDraft[key] = input.value;
            scheduleAutoRefresh();
          });
        });

        const fileInput = app.querySelector("[data-app-cv-file]");
        if (fileInput) {
          fileInput.addEventListener("change", () => {
            const selectedFile = fileInput.files && fileInput.files[0]
              ? fileInput.files[0]
              : null;

            applicationDraft.cvFile = selectedFile;
            applicationDraft.cvFileName = selectedFile
              ? selectedFile.name
              : "";
            scheduleAutoRefresh();
          });
        }
      }

      function hasApplicationDraftInput() {
        return Boolean(
          applicationDraft.company.trim() ||
          applicationDraft.role.trim() ||
          applicationDraft.jobLink.trim() ||
          applicationDraft.notes.trim() ||
          applicationDraft.cvFileName.trim()
        );
      }

      function updateHabitStatus(activity, nextDone) {
        if (busyAction) return;
        setActionBusy(true);

        google.script.run
          .withSuccessHandler(data => {
            dashboardData = data || {};
            lastSyncedAt = new Date();
            setActionBusy(false);
            showToast(nextDone ? "Habit marked done." : "Habit reopened.", "success");
            renderShell();
          })
          .withFailureHandler(error => {
            setActionBusy(false);
            showToast(error && error.message ? error.message : error, "error");
          })
          .updateWebHabitStatus(activity, nextDone);
      }

      function updateHabitNote(activity, note) {
        if (busyAction) return;
        setActionBusy(true);

        google.script.run
          .withSuccessHandler(data => {
            dashboardData = data || {};
            lastSyncedAt = new Date();
            setActionBusy(false);
            showToast("Habit note saved.", "success");
            renderShell();
          })
          .withFailureHandler(error => {
            setActionBusy(false);
            showToast(error && error.message ? error.message : error, "error");
          })
          .updateWebHabitNote(activity, note);
      }

      async function addApplicationFromWeb() {
        if (busyAction) return;

        const company = (app.querySelector("[data-app-company-input]") || {}).value || "";
        const role = (app.querySelector("[data-app-role-input]") || {}).value || "";
        const status = (app.querySelector("[data-app-status]") || {}).value || "";
        const notes = (app.querySelector("[data-app-notes]") || {}).value || "";
        const jobLink = (app.querySelector("[data-app-job-link]") || {}).value || "";
        const dateApplied = (app.querySelector("[data-app-date-applied]") || {}).value || "";
        const fileInput = app.querySelector("[data-app-cv-file]");
        const cvFile = fileInput && fileInput.files && fileInput.files[0]
          ? fileInput.files[0]
          : applicationDraft.cvFile;

        const missingFields = [];

        if (!company.trim()) missingFields.push("company");
        if (!role.trim()) missingFields.push("role");
        if (!status.trim()) missingFields.push("status");
        if (!dateApplied.trim()) missingFields.push("date applied");
        if (!jobLink.trim()) missingFields.push("job link");
        if (!cvFile) missingFields.push("CV PDF");

        if (missingFields.length > 0) {
          showToast("Missing: " + missingFields.join(", ") + ".", "error");
          return;
        }

        setActionBusy(true);

        let cvPayload;

        try {
          cvPayload = await readFileAsPayload(cvFile);
        } catch (error) {
          setActionBusy(false);
          showToast(error && error.message ? error.message : error, "error");
          return;
        }

        google.script.run
          .withSuccessHandler(data => {
            dashboardData = data || {};
            lastSyncedAt = new Date();
            applicationDraft = getEmptyApplicationDraft();
            setActionBusy(false);
            showToast("Application added.", "success");
            renderShell();
          })
          .withFailureHandler(error => {
            setActionBusy(false);
            showToast(error && error.message ? error.message : error, "error");
          })
          .addWebApplication(company, role, status, notes, jobLink, cvPayload, dateApplied);
      }

      function readFileAsPayload(file) {
        return new Promise((resolve, reject) => {
          if (!file || (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf"))) {
            reject(new Error("CV file must be a PDF."));
            return;
          }

          const reader = new FileReader();

          reader.onload = () => {
            const result = String(reader.result || "");
            const commaIndex = result.indexOf(",");

            resolve({
              name: file.name,
              mimeType: file.type || "application/pdf",
              base64: commaIndex === -1 ? result : result.substring(commaIndex + 1)
            });
          };

          reader.onerror = () => reject(new Error("Could not read CV PDF file."));
          reader.readAsDataURL(file);
        });
      }

      function updateApplicationStatus(rowIndex, company, role, status) {
        if (busyAction) return;
        setActionBusy(true);

        google.script.run
          .withSuccessHandler(data => {
            dashboardData = data || {};
            lastSyncedAt = new Date();
            setActionBusy(false);
            showToast("Application status saved.", "success");
            renderShell();
          })
          .withFailureHandler(error => {
            setActionBusy(false);
            showToast(error && error.message ? error.message : error, "error");
          })
          .updateWebApplicationStatus(rowIndex, company, role, status);
      }

      function loadTradingRange() {
        if (busyAction || !tradingRange.startDate || !tradingRange.endDate) return;
        setActionBusy(true);

        google.script.run
          .withSuccessHandler(tradingData => {
            dashboardData = Object.assign({}, dashboardData, { trading: tradingData || {} });
            lastSyncedAt = new Date();
            setActionBusy(false);
            renderShell();
          })
          .withFailureHandler(error => {
            setActionBusy(false);
            showToast(error && error.message ? error.message : error, "error");
          })
          .getWebTradingDataForRange(tradingRange.startDate, tradingRange.endDate);
      }

      function getDefaultTradingRange() {
        const end = new Date();
        const start = new Date(end);
        start.setDate(end.getDate() - 6);

        return {
          startDate: toDateInputValue(start),
          endDate: toDateInputValue(end)
        };
      }

      function toDateInputValue(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function showToast(message, type) {
        window.clearTimeout(toastTimer);
        const existing = document.querySelector(".toast");
        if (existing) existing.remove();

        const toast = document.createElement("div");
        toast.className = `toast ${type || ""}`;
        toast.textContent = message;
        document.body.appendChild(toast);

        toastTimer = window.setTimeout(() => {
          toast.remove();
        }, 3200);
      }

      function scheduleAutoRefresh() {
        window.clearTimeout(autoRefreshTimer);

        if (document.hidden || busyAction || hasApplicationDraftInput()) return;

        autoRefreshTimer = window.setTimeout(() => {
          loadDashboard({ silent: true });
        }, AUTO_REFRESH_INTERVAL_MS);
      }

      function handleVisibilityChange() {
        if (document.hidden) {
          window.clearTimeout(autoRefreshTimer);
          updateSyncIndicator();
          return;
        }

        loadDashboard({ silent: true });
      }

      function getSyncPulseClass() {
        if (isSyncing) return "syncing";
        if (document.hidden) return "paused";
        return "";
      }

      function getSyncStatusText(generatedAt) {
        if (isSyncing) {
          return "Personal Productivity OS · Syncing...";
        }

        if (document.hidden) {
          return "Personal Productivity OS · Auto-sync paused";
        }

        if (lastSyncedAt) {
          return "Personal Productivity OS · Last synced " + formatLocalTime(lastSyncedAt);
        }

        return "Personal Productivity OS · " + (generatedAt || "Live");
      }

      function updateSyncIndicator() {
        const pulse = app.querySelector(".pulse");
        const text = app.querySelector(".status-text");

        if (pulse) {
          pulse.className = "pulse " + getSyncPulseClass();
        }

        if (text) {
          text.textContent = getSyncStatusText(dashboardData && dashboardData.generatedAt);
        }
      }

      function formatLocalTime(date) {
        return date.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function renderError(error) {
        window.clearTimeout(loadTimer);
        app.className = "loading";
        app.innerHTML = `
          <div class="loading-card">
            Dashboard failed to load: ${escapeHtml(error && error.message ? error.message : error)}
          </div>
        `;
      }
    </script>
  </body>
</html>
